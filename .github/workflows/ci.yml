name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Start LocalDB
        run: sqllocaldb start MSSQLLocalDB

      - name: Restore
        run: dotnet restore PHCIS.ClinicBookingTyrone.slnx

      - name: Build
        run: dotnet build PHCIS.ClinicBookingTyrone.slnx --no-restore -c Release

      - name: Test
        run: dotnet test PHCIS.ClinicBookingTyrone.slnx --no-build -c Release --verbosity normal
